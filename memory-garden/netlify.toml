# 기억 정원 · Netlify 설정
# Netlify 사이트 설정: Branch = team, Base directory = memory-garden, Publish directory = memory-garden
# 빌드는 공개용 설정 파일(js/config.js)만 만들어요. 값은 Site configuration → Environment variables:
#   MG_KAKAO_JS_KEY, MG_SUPABASE_URL, MG_SUPABASE_PUBLISHABLE_KEY  (모두 공개용)
# 비밀 키(Supabase secret/service_role, DB 비밀번호)는 Netlify에도 넣지 않아요. 앱이 쓰지 않아요.
[build]
  publish = "."
  command = "node tools/write-config.mjs"

[build.environment]
  NODE_VERSION = "20"

# 서버 설정·도구 파일은 웹에 내보내지 않아요
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=()"

# 그림·글꼴·라이브러리는 오래 캐시
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 코드·화면은 배포하면 바로 바뀌도록
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
